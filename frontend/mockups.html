<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  h1,h2,h3,h4,p,ul,ol,figure{margin:0;}
  ul,ol{padding:0;list-style:none;}
  img,svg{display:block;max-width:100%;}
  button,input,select,textarea{font:inherit;color:inherit;}
</style>
<title>CarRental — UI/UX Design</title>

<style>
/* ============================================================
   PRESENTATION CHROME
   ============================================================ */
:root{
  --c-bg:#E9EDEC; --c-panel:#FFFFFF; --c-panel-2:#F4F7F6;
  --c-fg:#0B1211; --c-muted:#65736F; --c-faint:#8C9A96;
  --c-line:#D8E0DE; --c-accent:#0F766E; --c-accent-soft:#DCEEEB; --c-accent-fg:#FFFFFF;
  --c-shadow:0 1px 2px rgba(11,18,17,.05), 0 12px 32px -12px rgba(11,18,17,.18);

  /* product tokens — light */
  --p-bg:#FFFFFF; --p-surface:#FFFFFF; --p-subtle:#F4F7F6; --p-subtle-2:#EBF0EF;
  --p-fg:#0B1211; --p-muted:#6B7674; --p-faint:#95A19E;
  --p-line:#E3E8E7; --p-line-strong:#CBD5D3;
  --p-primary:#0F766E; --p-primary-fg:#FFFFFF; --p-primary-soft:#E4F1EE; --p-primary-ink:#0B5850;
  --p-star:#D97706;
  --st-pend-fg:#8A4B04; --st-pend-bg:#FDF0DC;
  --st-conf-fg:#0B5850; --st-conf-bg:#D9EFEB;
  --st-prog-fg:#1A47B8; --st-prog-bg:#DEE8FD;
  --st-done-fg:#54605D; --st-done-bg:#EDF1F0;
  --st-canc-fg:#A3231F; --st-canc-bg:#FBE3E1;
  --p-shadow:0 1px 2px rgba(11,18,17,.04), 0 8px 24px -12px rgba(11,18,17,.16);
}
@media (prefers-color-scheme: dark){
  :root{
    --c-bg:#070B0A; --c-panel:#0F1514; --c-panel-2:#151D1B;
    --c-fg:#E7EDEB; --c-muted:#8A9895; --c-faint:#6B7A76;
    --c-line:#1F2A28; --c-accent:#2DD4BF; --c-accent-soft:#0F2B27; --c-accent-fg:#052421;
    --c-shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.7);

    --p-bg:#0B100F; --p-surface:#111817; --p-subtle:#161F1D; --p-subtle-2:#1B2523;
    --p-fg:#E9EFEE; --p-muted:#8B9996; --p-faint:#6C7A77;
    --p-line:#232F2D; --p-line-strong:#33413E;
    --p-primary:#2DD4BF; --p-primary-fg:#052421; --p-primary-soft:#10312C; --p-primary-ink:#7FE7DA;
    --p-star:#F0B429;
    --st-pend-fg:#F0B429; --st-pend-bg:#33260A;
    --st-conf-fg:#5EEAD4; --st-conf-bg:#0E332E;
    --st-prog-fg:#93B4FF; --st-prog-bg:#132244;
    --st-done-fg:#9AA7A4; --st-done-bg:#1D2726;
    --st-canc-fg:#FCA5A1; --st-canc-bg:#3A1917;
    --p-shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="light"]{
  --c-bg:#E9EDEC; --c-panel:#FFFFFF; --c-panel-2:#F4F7F6;
  --c-fg:#0B1211; --c-muted:#65736F; --c-faint:#8C9A96;
  --c-line:#D8E0DE; --c-accent:#0F766E; --c-accent-soft:#DCEEEB; --c-accent-fg:#FFFFFF;
  --c-shadow:0 1px 2px rgba(11,18,17,.05), 0 12px 32px -12px rgba(11,18,17,.18);
  --p-bg:#FFFFFF; --p-surface:#FFFFFF; --p-subtle:#F4F7F6; --p-subtle-2:#EBF0EF;
  --p-fg:#0B1211; --p-muted:#6B7674; --p-faint:#95A19E;
  --p-line:#E3E8E7; --p-line-strong:#CBD5D3;
  --p-primary:#0F766E; --p-primary-fg:#FFFFFF; --p-primary-soft:#E4F1EE; --p-primary-ink:#0B5850;
  --p-star:#D97706;
  --st-pend-fg:#8A4B04; --st-pend-bg:#FDF0DC;
  --st-conf-fg:#0B5850; --st-conf-bg:#D9EFEB;
  --st-prog-fg:#1A47B8; --st-prog-bg:#DEE8FD;
  --st-done-fg:#54605D; --st-done-bg:#EDF1F0;
  --st-canc-fg:#A3231F; --st-canc-bg:#FBE3E1;
  --p-shadow:0 1px 2px rgba(11,18,17,.04), 0 8px 24px -12px rgba(11,18,17,.16);
}
:root[data-theme="dark"]{
  --c-bg:#070B0A; --c-panel:#0F1514; --c-panel-2:#151D1B;
  --c-fg:#E7EDEB; --c-muted:#8A9895; --c-faint:#6B7A76;
  --c-line:#1F2A28; --c-accent:#2DD4BF; --c-accent-soft:#0F2B27; --c-accent-fg:#052421;
  --c-shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.7);
  --p-bg:#0B100F; --p-surface:#111817; --p-subtle:#161F1D; --p-subtle-2:#1B2523;
  --p-fg:#E9EFEE; --p-muted:#8B9996; --p-faint:#6C7A77;
  --p-line:#232F2D; --p-line-strong:#33413E;
  --p-primary:#2DD4BF; --p-primary-fg:#052421; --p-primary-soft:#10312C; --p-primary-ink:#7FE7DA;
  --p-star:#F0B429;
  --st-pend-fg:#F0B429; --st-pend-bg:#33260A;
  --st-conf-fg:#5EEAD4; --st-conf-bg:#0E332E;
  --st-prog-fg:#93B4FF; --st-prog-bg:#132244;
  --st-done-fg:#9AA7A4; --st-done-bg:#1D2726;
  --st-canc-fg:#FCA5A1; --st-canc-bg:#3A1917;
  --p-shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box;}
body{
  margin:0; background:var(--c-bg); color:var(--c-fg);
  font-family:ui-sans-serif,system-ui,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",monospace;}

.shell{display:grid; grid-template-columns:268px minmax(0,1fr); min-height:100vh;}

/* ---- rail ---- */
.rail{
  background:var(--c-panel); border-right:1px solid var(--c-line);
  padding:22px 0 40px; position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column; gap:20px;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 20px;}
.brand__mark{
  width:30px; height:30px; border-radius:9px; background:var(--c-accent);
  display:grid; place-items:center; color:var(--c-accent-fg); flex:none;
}
.brand__name{font-weight:650; letter-spacing:-.01em; font-size:15px;}
.brand__sub{font-size:11.5px; color:var(--c-faint); letter-spacing:.04em; text-transform:uppercase;}

/* role switcher */
.roles{display:flex; flex-wrap:wrap; gap:5px; padding:0 20px;}
.role{
  padding:5px 11px; border-radius:999px; border:1px solid var(--c-line); background:transparent;
  color:var(--c-muted); font:inherit; font-size:12px; cursor:pointer; line-height:1.4;
}
.role:hover{color:var(--c-fg); border-color:var(--c-faint);}
.role.is-on{background:var(--c-accent); border-color:var(--c-accent); color:var(--c-accent-fg); font-weight:600;}
.role:focus-visible{outline:2px solid var(--c-accent); outline-offset:2px;}
.role__n{opacity:.6; font-variant-numeric:tabular-nums; margin-left:3px;}

/* swipe pager */
.pager{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:60;
  display:flex; align-items:center; gap:2px; background:var(--c-panel);
  border:1px solid var(--c-line); border-radius:999px; padding:6px 8px; box-shadow:var(--c-shadow);
}
.pager__btn{
  width:32px; height:32px; border-radius:50%; border:0; background:transparent; color:var(--c-muted);
  cursor:pointer; display:grid; place-items:center; flex:none;
}
.pager__btn:hover:not([disabled]){background:var(--c-panel-2); color:var(--c-fg);}
.pager__btn[disabled]{opacity:.28; cursor:not-allowed;}
.pager__btn:focus-visible,.pager__dot:focus-visible{outline:2px solid var(--c-accent); outline-offset:2px;}
.pager__label{
  font-size:12px; color:var(--c-muted); padding:0 8px; white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.pager__label b{color:var(--c-fg); font-weight:600;}
.pager__dots{display:flex; align-items:center; gap:5px; padding:0 6px;}
.pager__dot{
  width:6px; height:6px; border-radius:50%; background:var(--c-line); border:0; padding:0;
  cursor:pointer; transition:width .18s ease, background .18s ease;
}
.pager__dot:hover{background:var(--c-faint);}
.pager__dot.is-on{background:var(--c-accent); width:17px; border-radius:3px;}
@media (prefers-reduced-motion: reduce){ .pager__dot{transition:none;} }
.swipe-hint{
  display:none; text-align:center; font-size:12px; color:var(--c-faint); margin-top:16px;
}

.nav-group{display:flex; flex-direction:column; gap:2px; padding:0 12px;}
.nav-group__label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.11em; font-weight:640;
  color:var(--c-faint); padding:10px 8px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:7px 8px; border-radius:8px; border:0; background:transparent; cursor:pointer;
  font:inherit; font-size:13.5px; color:var(--c-muted); line-height:1.35;
}
.nav-item:hover{background:var(--c-panel-2); color:var(--c-fg);}
.nav-item.is-active{background:var(--c-accent-soft); color:var(--c-accent); font-weight:600;}
.nav-item__num{
  font-size:10.5px; width:20px; flex:none; text-align:right; color:var(--c-faint);
  font-variant-numeric:tabular-nums;
}
.nav-item.is-active .nav-item__num{color:var(--c-accent);}
.nav-item:focus-visible,.tbtn:focus-visible{outline:2px solid var(--c-accent); outline-offset:2px;}

.rail__foot{margin-top:auto; padding:0 20px; display:flex; flex-direction:column; gap:10px;}
.tbtn{
  border:1px solid var(--c-line); background:transparent; color:var(--c-muted);
  border-radius:8px; padding:7px 10px; font:inherit; font-size:12.5px; cursor:pointer;
  display:flex; align-items:center; gap:8px; justify-content:center;
}
.tbtn:hover{color:var(--c-fg); border-color:var(--c-fg);}

/* ---- stage ---- */
.stage{padding:34px 40px 104px; min-width:0;}
.stage__head{max-width:820px; margin-bottom:22px;}
.eyebrow{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; font-weight:640;
  color:var(--c-accent); margin-bottom:8px;
}
.stage__title{
  font-size:30px; line-height:1.15; letter-spacing:-.022em; font-weight:660; margin:0 0 8px;
  text-wrap:balance;
}
.stage__desc{color:var(--c-muted); font-size:15px; margin:0; max-width:66ch;}
.route{
  display:inline-flex; align-items:center; gap:6px; margin-top:12px;
  background:var(--c-panel); border:1px solid var(--c-line); border-radius:7px;
  padding:4px 9px; font-size:12px; color:var(--c-muted);
}
.route b{color:var(--c-fg); font-weight:600;}

/* browser frame */
.frame{
  background:var(--p-bg); border:1px solid var(--c-line); border-radius:14px;
  box-shadow:var(--c-shadow); overflow:hidden; max-width:1240px;
}
.frame__bar{
  display:flex; align-items:center; gap:12px; padding:9px 14px;
  background:var(--c-panel-2); border-bottom:1px solid var(--c-line);
}
.dots{display:flex; gap:6px;}
.dots i{width:9px; height:9px; border-radius:50%; background:var(--c-line);}
.frame__url{
  flex:1; background:var(--c-panel); border:1px solid var(--c-line); border-radius:6px;
  padding:3px 10px; font-size:11.5px; color:var(--c-muted); max-width:460px;
}
.frame__url b{color:var(--c-fg); font-weight:600;}
.frame__body{background:var(--p-bg); color:var(--p-fg); overflow-x:auto;}

/* phone frame */
.phones{display:flex; gap:26px; flex-wrap:wrap;}
.phone{
  width:300px; flex:none; border:1px solid var(--c-line); border-radius:26px;
  background:var(--p-bg); color:var(--p-fg); overflow:hidden; box-shadow:var(--c-shadow);
}
.phone__notch{height:26px; display:grid; place-items:center; background:var(--p-bg);}
.phone__notch i{width:64px; height:5px; border-radius:3px; background:var(--p-line-strong); display:block;}
.phone__label{
  margin-top:10px; font-size:12px; color:var(--c-muted); text-align:center;
}

/* annotation strip */
.notes{
  margin-top:22px; max-width:1240px; background:var(--c-panel); border:1px solid var(--c-line);
  border-radius:12px; padding:18px 20px;
}
.notes__title{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; font-weight:640;
  color:var(--c-faint); margin-bottom:12px;
}
.notes ul{margin:0; padding:0; list-style:none; display:grid; gap:10px;}
@media (min-width:1000px){ .notes ul{grid-template-columns:1fr 1fr; gap:10px 32px;} }
.notes li{
  display:grid; grid-template-columns:16px 1fr; gap:10px; font-size:13.5px; color:var(--c-muted);
  line-height:1.5;
}
.notes li::before{
  content:""; width:6px; height:6px; border-radius:2px; background:var(--c-accent);
  margin-top:7px; margin-left:5px;
}
.notes li b{color:var(--c-fg); font-weight:600;}
.notes li.warn::before{background:#D97706;}

.screen{display:none;}
.screen.is-active{display:block; animation:fade .22s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion: reduce){ .screen.is-active{animation:none;} }

@media (max-width:900px){
  .shell{grid-template-columns:1fr;}
  .rail{position:static; height:auto; border-right:0; border-bottom:1px solid var(--c-line);}
  .rail__foot{margin-top:12px;}
  .stage{padding:24px 18px 104px;}
  .stage__title{font-size:24px;}
  .roles{padding:0 18px;}
}
@media (hover:none){ .swipe-hint{display:block;} }

/* ============================================================
   PRODUCT DESIGN SYSTEM  (everything inside .ui)
   ============================================================ */
.ui{font-size:14px; line-height:1.5; color:var(--p-fg); min-width:940px;}
.ui.ui--fluid{min-width:0;}
.ui *{box-sizing:border-box;}
.ui h1,.ui h2,.ui h3,.ui h4,.ui p{margin:0;}
.ui h1{font-size:27px; line-height:1.18; letter-spacing:-.02em; font-weight:660;}
.ui h2{font-size:19px; line-height:1.3; letter-spacing:-.014em; font-weight:640;}
.ui h3{font-size:15px; line-height:1.35; font-weight:620;}
.ui h4{font-size:12.5px; line-height:1.35; font-weight:640;}
.ui small{font-size:12.5px;}
.u-muted{color:var(--p-muted);}
.u-faint{color:var(--p-faint);}
.u-num{font-variant-numeric:tabular-nums;}
.label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:640;
  color:var(--p-faint);
}

/* app bar */
.appbar{
  display:flex; align-items:center; gap:22px; padding:0 26px; height:62px;
  border-bottom:1px solid var(--p-line); background:var(--p-surface);
}
.logo{display:flex; align-items:center; gap:9px; font-weight:660; letter-spacing:-.015em; font-size:15.5px;}
.logo__mark{
  width:26px; height:26px; border-radius:8px; background:var(--p-primary); color:var(--p-primary-fg);
  display:grid; place-items:center; flex:none;
}
.appbar__links{display:flex; gap:4px; margin-left:8px;}
.appbar__links a{
  padding:6px 11px; border-radius:7px; color:var(--p-muted); text-decoration:none; font-size:13.5px;
}
.appbar__links a.is-active{color:var(--p-fg); background:var(--p-subtle); font-weight:590;}
.appbar__right{margin-left:auto; display:flex; align-items:center; gap:12px;}
.avatar{
  width:30px; height:30px; border-radius:50%; background:var(--p-primary-soft); color:var(--p-primary-ink);
  display:grid; place-items:center; font-size:12px; font-weight:640; flex:none;
}

/* buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border-radius:9px; border:1px solid transparent; padding:9px 16px;
  font:inherit; font-size:13.5px; font-weight:590; cursor:pointer; white-space:nowrap;
  background:var(--p-subtle); color:var(--p-fg); line-height:1.2;
}
.btn--primary{background:var(--p-primary); color:var(--p-primary-fg);}
.btn--outline{background:transparent; border-color:var(--p-line-strong); color:var(--p-fg);}
.btn--ghost{background:transparent; color:var(--p-muted);}
.btn--sm{padding:6px 11px; font-size:12.5px; border-radius:7px;}
.btn--lg{padding:12px 20px; font-size:15px; border-radius:10px;}
.btn--block{width:100%;}
.btn--danger{background:transparent; border-color:var(--st-canc-fg); color:var(--st-canc-fg);}
.btn[disabled],.btn.is-disabled{opacity:.45; cursor:not-allowed;}

/* surfaces */
.card{
  background:var(--p-surface); border:1px solid var(--p-line); border-radius:13px;
}
.card--pad{padding:18px;}
.card--hover{box-shadow:var(--p-shadow);}
.divider{height:1px; background:var(--p-line); border:0; margin:0;}

/* pills / badges */
.pill{
  display:inline-flex; align-items:center; gap:5px; border-radius:999px;
  padding:3px 10px; font-size:11.5px; font-weight:600; line-height:1.5;
  background:var(--p-subtle); color:var(--p-muted);
}
.pill i{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none;}
.pill--pend{background:var(--st-pend-bg); color:var(--st-pend-fg);}
.pill--conf{background:var(--st-conf-bg); color:var(--st-conf-fg);}
.pill--prog{background:var(--st-prog-bg); color:var(--st-prog-fg);}
.pill--done{background:var(--st-done-bg); color:var(--st-done-fg);}
.pill--canc{background:var(--st-canc-bg); color:var(--st-canc-fg);}
.chip{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--p-line);
  border-radius:999px; padding:6px 13px; font-size:12.5px; color:var(--p-muted); background:var(--p-surface);
}
.chip.is-on{border-color:var(--p-primary); background:var(--p-primary-soft); color:var(--p-primary-ink); font-weight:590;}

/* form fields */
.field{display:flex; flex-direction:column; gap:6px;}
.field__label{font-size:12.5px; font-weight:590; color:var(--p-fg);}
.input{
  border:1px solid var(--p-line-strong); border-radius:9px; background:var(--p-surface);
  padding:9px 12px; font-size:13.5px; color:var(--p-fg); min-height:38px; display:flex;
  align-items:center; gap:8px;
}
.input--ph{color:var(--p-faint);}
.input--focus{border-color:var(--p-primary); box-shadow:0 0 0 3px var(--p-primary-soft);}
.input--err{border-color:var(--st-canc-fg);}
.hint{font-size:11.5px; color:var(--p-faint);}
.hint--err{color:var(--st-canc-fg);}
.hint--ok{color:var(--p-primary);}

/* photo placeholders — CSS-only car imagery */
.photo{
  position:relative; background:linear-gradient(145deg,#8FA6A2,#5C7873); overflow:hidden;
  display:grid; place-items:center;
}
.photo::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(120% 90% at 22% 8%, rgba(255,255,255,.34), transparent 58%);
}
.photo svg{width:52%; max-width:150px; opacity:.5; color:#fff; position:relative; z-index:1;}
.photo--a{background:linear-gradient(145deg,#7E97B5,#3F5878);}
.photo--b{background:linear-gradient(145deg,#A79B8C,#6B5E4E);}
.photo--c{background:linear-gradient(145deg,#8CA8A0,#456159);}
.photo--d{background:linear-gradient(145deg,#9B8FA6,#5A4C69);}
.photo--e{background:linear-gradient(145deg,#B39B96,#75534D);}
.photo--f{background:linear-gradient(145deg,#7FA3A8,#3A5F66);}

/* car card */
.carcard{
  border:1px solid var(--p-line); border-radius:13px; overflow:hidden; background:var(--p-surface);
  display:flex; flex-direction:column;
}
.carcard__img{aspect-ratio:16/10;}
.carcard__body{padding:13px 14px 15px; display:flex; flex-direction:column; gap:5px;}
.carcard__top{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
.carcard__name{font-size:14.5px; font-weight:620; letter-spacing:-.01em;}
.carcard__meta{font-size:12.5px; color:var(--p-muted);}
.carcard__price{margin-top:6px; display:flex; align-items:baseline; gap:6px;}
.carcard__price b{font-size:16px; font-weight:660; letter-spacing:-.015em;}
.star{color:var(--p-star); font-size:12.5px; display:inline-flex; align-items:center; gap:3px; font-weight:600;}

/* layout helpers */
.row{display:flex; align-items:center; gap:10px;}
.row--between{justify-content:space-between;}
.row--wrap{flex-wrap:wrap;}
.col{display:flex; flex-direction:column;}
.gap0{gap:0;} .gap1{gap:1px;} .gap2{gap:2px;} .gap3{gap:3px;} .gap4{gap:4px;}
.gap5{gap:5px;} .gap6{gap:6px;} .gap8{gap:8px;} .gap9{gap:9px;} .gap10{gap:10px;}
.gap12{gap:12px;} .gap14{gap:14px;} .gap16{gap:16px;} .gap18{gap:18px;}
.gap20{gap:20px;} .gap24{gap:24px;} .gap32{gap:32px;}
.pad{padding:26px;}
.pad--lg{padding:34px 30px;}
.grow{flex:1; min-width:0;}
.sec{padding:26px; display:flex; flex-direction:column; gap:18px;}

/* tables */
.tbl{width:100%; border-collapse:collapse; font-size:13px;}
.tbl th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--p-faint); font-weight:640; padding:0 12px 9px; border-bottom:1px solid var(--p-line);
}
.tbl td{padding:12px; border-bottom:1px solid var(--p-line); vertical-align:middle;}
.tbl tr:last-child td{border-bottom:0;}
.tbl td b{font-weight:600;}

/* price breakdown */
.price-row{display:flex; justify-content:space-between; font-size:13.5px; color:var(--p-muted);}
.price-row b{color:var(--p-fg); font-weight:590; font-variant-numeric:tabular-nums;}
.price-total{display:flex; justify-content:space-between; align-items:baseline; font-weight:660;}
.price-total span{font-size:15px;}
.price-total b{font-size:22px; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}

/* sidebar shells */
.side{
  width:212px; flex:none; border-right:1px solid var(--p-line); background:var(--p-surface);
  padding:16px 12px; display:flex; flex-direction:column; gap:2px;
}
.side a{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px;
  color:var(--p-muted); text-decoration:none; font-size:13.5px;
}
.side a.is-active{background:var(--p-primary-soft); color:var(--p-primary-ink); font-weight:600;}
.side__label{
  font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--p-faint);
  font-weight:640; padding:14px 10px 6px;
}

/* stat tile */
.stat{border:1px solid var(--p-line); border-radius:12px; padding:15px 16px; background:var(--p-surface);}
.stat__k{font-size:11.5px; color:var(--p-muted); font-weight:560;}
.stat__v{font-size:25px; font-weight:660; letter-spacing:-.025em; margin-top:5px; font-variant-numeric:tabular-nums;}
.stat__d{font-size:11.5px; color:var(--p-muted); margin-top:2px;}
.stat__d b{color:var(--p-primary); font-weight:620;}

/* timeline */
.tl{display:flex; align-items:center; gap:0;}
.tl__step{display:flex; flex-direction:column; align-items:center; gap:7px; flex:none; width:104px; text-align:center;}
.tl__dot{
  width:26px; height:26px; border-radius:50%; border:2px solid var(--p-line-strong);
  background:var(--p-surface); display:grid; place-items:center; font-size:11px; color:var(--p-faint);
}
.tl__step.is-done .tl__dot{background:var(--p-primary); border-color:var(--p-primary); color:var(--p-primary-fg);}
.tl__step.is-now .tl__dot{border-color:var(--p-primary); color:var(--p-primary); box-shadow:0 0 0 4px var(--p-primary-soft);}
.tl__t{font-size:11.5px; color:var(--p-muted);}
.tl__step.is-now .tl__t,.tl__step.is-done .tl__t{color:var(--p-fg); font-weight:590;}
.tl__bar{height:2px; background:var(--p-line); flex:1; min-width:14px;}
.tl__bar.is-done{background:var(--p-primary);}

/* skeleton */
.sk{background:var(--p-subtle-2); border-radius:6px;}

/* misc */
.stepper{display:flex; align-items:center; gap:10px;}
.stepper__i{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--p-faint);}
.stepper__n{
  width:22px; height:22px; border-radius:50%; border:1.5px solid var(--p-line-strong);
  display:grid; place-items:center; font-size:11px; font-weight:640;
}
.stepper__i.is-done .stepper__n{background:var(--p-primary); border-color:var(--p-primary); color:var(--p-primary-fg);}
.stepper__i.is-now{color:var(--p-fg); font-weight:600;}
.stepper__i.is-now .stepper__n{border-color:var(--p-primary); color:var(--p-primary);}
.stepper__line{width:26px; height:1.5px; background:var(--p-line);}

.upload{
  border:1.5px dashed var(--p-line-strong); border-radius:11px; padding:18px;
  display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center;
  background:var(--p-subtle); color:var(--p-muted);
}
.swatch{border-radius:9px; height:56px; border:1px solid var(--p-line);}
.toast{
  display:flex; gap:11px; align-items:flex-start; border:1px solid var(--p-line);
  background:var(--p-surface); border-radius:11px; padding:12px 14px; box-shadow:var(--p-shadow);
  max-width:370px;
}
.toast__ic{
  width:22px; height:22px; border-radius:50%; display:grid; place-items:center; flex:none;
  font-size:12px; font-weight:700;
}
.slider{height:5px; border-radius:3px; background:var(--p-subtle-2); position:relative;}
.slider i{position:absolute; height:100%; border-radius:3px; background:var(--p-primary);}
.slider b{
  position:absolute; top:50%; width:15px; height:15px; border-radius:50%; background:var(--p-surface);
  border:2px solid var(--p-primary); transform:translate(-50%,-50%);
}
.gapline{border-left:3px solid var(--st-pend-fg); background:var(--st-pend-bg); border-radius:0 9px 9px 0;
  padding:10px 13px; font-size:12.5px; color:var(--st-pend-fg);}
</style>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6.5 17l-1.3-5.2a2 2 0 0 1 .3-1.7l1.6-2.3A2 2 0 0 1 8.7 7h6.6a2 2 0 0 1 1.6.8l1.6 2.3a2 2 0 0 1 .3 1.7L17.5 17"/><circle cx="7.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/></svg>
      </span>
      <span>
        <span class="brand__name">CarRental</span><br>
        <span class="brand__sub">UI/UX Spec v1</span>
      </span>
    </div>

    <div>
      <p class="nav-group__label" style="padding:0 20px 8px;">Walk through as</p>
      <div class="roles" id="roles" role="tablist" aria-label="Walk through as a role"></div>
    </div>

    <nav class="nav-group" id="nav"></nav>

</div>

  <button class="pager__btn" id="prevBtn" type="button" aria-label="Previous screen">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>

  </button>
</div>

<script>
const CAR_SVG = '<svg viewBox="0 0 120 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 34h104M14 34l-3-13a5 5 0 0 1 1-4.4l7-8A5 5 0 0 1 22.8 7h50a5 5 0 0 1 3.6 1.5l9 9.5 18 3.5a5 5 0 0 1 4 5v7.5"/><path d="M40 8v10M62 8v10M18 21h84"/><circle cx="34" cy="35" r="7"/><circle cx="88" cy="35" r="7"/></svg>';

const ico = (d, s=16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {

  car:'<path d="M5 17h14M6.5 17l-1.3-5.2a2 2 0 0 1 .3-1.7l1.6-2.3A2 2 0 0 1 8.7 7h6.6a2 2 0 0 1 1.6.8l1.6 2.3a2 2 0 0 1 .3 1.7L17.5 17"/><circle cx="7.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/>',

const nav = (active) => `

const searchbar = (compact) => `
<div class="row ${compact?'':'gap8'}" style="border:1px solid var(--p-line-strong); border-radius:${compact?'10px':'14px'}; background:var(--p-surface); padding:${compact?'5px 5px 5px 14px':'7px 7px 7px 18px'}; box-shadow:var(--p-shadow);">

const SCREENS = [];
const S = (group, title, desc, route, html, notes) => SCREENS.push({group,title,desc,route,html,notes});

/* ─────────────────────────── 1. LANDING ─────────────────────────── */
S('Renter','Landing','The single job of this page is to get a city and a date range into the URL. Everything else is secondary.','/',`

    <div class="row row--wrap gap10">

      <span class="chip">Pickup</span><span class="chip">${ico(I.bolt,14)} Electric</span>

      ${carcard('photo--a','Toyota Corolla 2022','Automatic · Petrol · 5 seats','4.9','48','Cairo','42','176')}

      <div class="col gap8"><span class="avatar" style="width:34px;height:34px;">${ico(I.shield,16)}</span><h3>Verified drivers</h3><p class="u-muted" style="font-size:13px;">Upload your licence and ID once. Owners see a verified badge before they hand over the keys.</p></div>
      <div class="col gap8"><span class="avatar" style="width:34px;height:34px;">${ico(I.check,16)}</span><h3>Documented handover</h3><p class="u-muted" style="font-size:13px;">Odometer, fuel, cleanliness and damage are recorded at pickup and return, with photos.</p></div>

`<b>Dates are pre-filled, always.</b> <code class="mono">GET /api/cars/search</code> requires <code class="mono">StartDate</code> and <code class="mono">EndDate</code> — there is no date-less browse, so the hero seeds tomorrow → +3 days rather than showing an empty state.`,
`<b>Category chips deep-link</b> into <code class="mono">/search?category=SUV</code>. The API accepts enum <i>names</i> in query strings, so the URL stays readable.`,

    <section style="padding:20px 26px 30px; display:flex; flex-direction:column; gap:16px;">
      <div class="row row--between">

  <div style="display:grid; grid-template-columns:1fr 1.05fr; min-height:600px;">
    <div style="position:relative; padding:40px; display:flex; flex-direction:column; justify-content:space-between; background:linear-gradient(165deg,var(--p-primary-soft),var(--p-subtle));">
      <span class="logo"><span class="logo__mark">${ico(I.car,15)}</span>CarRental</span>
      <div style="position:absolute; inset:auto 0 30% 0; opacity:.28; color:var(--p-primary); display:grid; place-items:center;">
        <div style="width:70%;">${CAR_SVG}</div>
      </div>
      <div class="col gap10" style="position:relative;">
        <h2 style="font-size:23px; letter-spacing:-.02em; max-width:22ch;">Every car on the platform belongs to a verified owner.</h2>
        <p class="u-muted" style="font-size:13.5px; max-width:38ch;">Licence and ID checks on both sides, and a photographed handover at pick-up and return.</p>
      </div>
    </div>

    <div style="padding:44px 56px; display:flex; flex-direction:column; justify-content:center;">
      <div style="max-width:400px; width:100%;">
        <div class="col gap6" style="margin-bottom:22px;">
          <h1>Create your account</h1>
          <p class="u-muted" style="font-size:13.5px;">Already have one? <a href="#" style="color:var(--p-primary); font-weight:590; text-decoration:none;">Sign in</a></p>
        </div>

        <div class="col gap16">
          <div class="col gap8">
            <span class="field__label">I'm here to…</span>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
              <div class="card col gap5" style="padding:13px; border-color:var(--p-primary); background:var(--p-primary-soft);">
                <span style="color:var(--p-primary-ink);">${ico(I.search,18)}</span>
                <span style="font-weight:620; font-size:13.5px;">Rent a car</span>
                <span class="u-muted" style="font-size:11.5px;">Book cars near me</span>
              </div>
              <div class="card col gap5" style="padding:13px;">
                <span class="u-faint">${ico(I.car,18)}</span>
                <span style="font-weight:620; font-size:13.5px;">List my car</span>
                <span class="u-muted" style="font-size:11.5px;">Earn from my car</span>
              </div>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div class="field"><span class="field__label">First name</span><span class="input">Omar</span></div>
            <div class="field"><span class="field__label">Last name</span><span class="input">Abbas</span></div>
          </div>

          <div class="field">
            <span class="field__label">Email</span>
            <span class="input input--focus">omar@example.com</span>
          </div>

          <div class="field">
            <span class="field__label">Password</span>
            <span class="input">••••••••••</span>
            <div class="row row--wrap gap10" style="margin-top:2px;">
              ${[['8+ characters',1],['Uppercase',1],['Lowercase',1],['Number',1],['Special character',0]].map(([r,ok])=>`
                <span class="row gap5" style="font-size:11.5px; color:var(--${ok?'p-primary':'p-faint'});">
                  <span style="width:13px;height:13px;border-radius:50%;border:1.4px solid currentColor;display:grid;place-items:center;">${ok?ico(I.check,8):''}</span>${r}</span>`).join('')}
            </div>
          </div>

          <button class="btn btn--primary btn--lg btn--block">Create account</button>

          <div class="toast" style="border-color:var(--st-pend-fg); background:var(--st-pend-bg); max-width:none;">
            <span class="toast__ic" style="background:var(--st-pend-fg); color:var(--p-surface);">!</span>
            <div class="col gap2">
              <span style="font-weight:600; font-size:13px; color:var(--st-pend-fg);">Too many attempts</span>
              <span style="font-size:12.5px; color:var(--st-pend-fg); opacity:.85;">Wait about a minute before trying again.</span>
            </div>
          </div>

          <p class="hint" style="text-align:center;">By continuing you agree to the terms and privacy policy.</p>
        </div>
      </div>
    </div>
  </div>
</div>`,[
`<b>The password checklist is the server's FluentValidation rule, live.</b> ≥8 chars, upper, lower, digit, and one special from the backend's allowed set — so a user never submits a password the API will reject.`,
`<b>The role cards write <code class="mono">UserRole</code> as an integer</b> — Renter <code class="mono">0</code>, Owner <code class="mono">1</code>. Enums serialise as ints in request bodies; sending <code class="mono">"Owner"</code> would 400.`,
`<b class="warn">The rate-limit state is designed, not discovered.</b> <code class="mono">/api/auth/*</code> allows 5 requests per minute <i>shared across all four routes</i>, so login, register, refresh and logout compete for the same budget. The submit button disables during flight and there is no auto-retry.`,
`<b>Register uses <code class="mono">/api/auth/register</code></b>, not <code class="mono">POST /api/users</code> — the latter skips the strong-password policy and returns no token.`,
`<b>Sign-in failures show "Email or password is incorrect"</b>, mapped client-side. The backend returns a bare 500 with a generic body for bad credentials, so the message has to come from the operation context.`]);

S('Auth','Account &amp; verification','Three documents, three independent statuses. The card explains why it matters instead of just demanding files.','/account/verification',`

        <span class="hint">Approved 26 Jul 2026</span>

      <div class="card card--pad col gap12">
        <div class="row row--between"><h3>Licence — back</h3><span class="pill pill--pend"><i></i>In review</span></div>

        <div class="field"><span class="field__label">ID type</span><span class="input" style="min-height:34px; font-size:13px;">National ID ▾</span></div>
      </div>
    </div>
  </div>
</div>`,[
`<b>Three tiles, three statuses</b> — but the backend collapses licence front and back into a single <code class="mono">DriverLicenseStatus</code>. The UI mirrors that: approving either side flips both tiles together.`,
`<b>Uploads are <code class="mono">multipart/form-data</code> to <code class="mono">POST /api/users/{id}/verification</code></b> with <code class="mono">File</code>, <code class="mono">Type</code>, and <code class="mono">IdType</code>. The response is a Cloudinary URL, which is what the preview renders.`,
`<b class="warn">The rejection reason shown here is UI-only.</b> The backend accepts a <code class="mono">reason</code> on review but never persists it — so either the field gets stored, or this copy stays generic. Flagged for the API.`,
`<b>No file validation exists server-side.</b> Size and MIME checks happen client-side before upload, or a large file becomes a 500.`]);

          <div class="toast">
            <span class="toast__ic" style="background:var(--p-primary); color:var(--p-primary-fg);">${ico(I.check,12)}</span>
            <div class="col gap2"><span style="font-weight:600; font-size:13px;">Trip started</span><span class="u-muted" style="font-size:12.5px;">Nour has the keys. Due back 28 Jul, 18:00.</span></div>
          </div>
          <div class="toast" style="border-color:var(--st-canc-fg);">
            <span class="toast__ic" style="background:var(--st-canc-bg); color:var(--st-canc-fg);">!</span>
            <div class="col gap2"><span style="font-weight:600; font-size:13px;">Those dates were just taken</span><span class="u-muted" style="font-size:12.5px;">Someone booked this car while you were deciding. Try different dates.</span></div>
          </div>
        </div>
        <p class="u-muted" style="font-size:13px; max-width:74ch;">The backend throws plain exceptions for business failures, so almost everything arrives as a bare 500 with a generic body. A <code class="mono">mapApiError(operation, status)</code> layer turns operation context into the messages above. No raw server text ever reaches a user, and no message apologises — it says what happened and what to do next.</p>
      </div>

      <hr class="divider">

      <div class="col gap12">
        <h2>Empty &amp; error</h2>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:820px;">
          <div class="card col gap12" style="padding:28px; align-items:center; text-align:center; border-style:dashed;">
            <span class="u-faint">${ico(I.search,26)}</span>
            <div class="col gap3"><h3>No cars on these dates</h3><p class="u-muted" style="font-size:13px;">Nothing in Cairo is free from 31 Jul to 3 Aug with your filters.</p></div>
            <div class="row gap8"><button class="btn btn--primary btn--sm">Widen the dates</button><button class="btn btn--outline btn--sm">Clear filters</button></div>
          </div>
          <div class="card col gap12" style="padding:28px; align-items:center; text-align:center;">
            <span style="color:var(--st-canc-fg);">${ico(I.alert,26)}</span>
            <div class="col gap3"><h3>We couldn't load this</h3><p class="u-muted" style="font-size:13px;">The connection dropped. Your filters are still saved.</p></div>
            <button class="btn btn--outline btn--sm">Try again</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>`,[
`<b>Tokens map 1:1 onto shadcn's CSS variables</b> — <code class="mono">--background</code>, <code class="mono">--foreground</code>, <code class="mono">--primary</code>, <code class="mono">--muted</code>, <code class="mono">--border</code>, <code class="mono">--radius</code> — so every installed component inherits the theme without per-component overrides.`,
`<b>Dark mode is defined at token level only.</b> No component branches on theme; flipping <code class="mono">.dark</code> on <code class="mono">&lt;html&gt;</code> redefines the variables and the whole app follows.`,
`<b>Numbers use tabular figures everywhere</b> — prices, odometers, day counts — so columns align and totals are comparable at a glance.`,
`<b>Status colour is never the only signal.</b> Every pill carries a dot, a label, and a background; the design stays readable in greyscale and for colour-blind users.`,
`<b>Components to install:</b> <code class="mono">button card input select calendar popover dialog sheet badge avatar tabs table dropdown-menu form label textarea checkbox slider separator skeleton sonner alert progress tooltip</code>.`]);

/* ─────────────────────────── render ─────────────────────────── */
const navEl = document.getElementById('nav');
const stageEl = document.getElementById('stage');
const rolesEl = document.getElementById('roles');
const groups = {};
SCREENS.forEach((s,i)=>{ (groups[s.group] ||= []).push({...s, i}); });

/* ---- role walkthroughs ---- */
const ROLES = [
  {key:'All',    label:'All screens', groups:Object.keys(groups)},
  {key:'Renter', label:'Renter',      groups:['Renter','Auth']},
  {key:'Owner',  label:'Owner',       groups:['Owner','Auth']},
  {key:'Admin',  label:'Admin',       groups:['Admin','Auth']},
  {key:'System', label:'System',      groups:['System']},
];
let role = ROLES[0];

/* screens in the current walkthrough, in presentation order */
const reel = () => SCREENS
  .map((s,i)=>({...s, i}))
  .filter(s=>role.groups.includes(s.group))
  .sort((a,b)=>role.groups.indexOf(a.group) - role.groups.indexOf(b.group) || a.i - b.i);

rolesEl.innerHTML = ROLES.map(r=>{
  const n = SCREENS.filter(s=>r.groups.includes(s.group)).length;
  return `<button class="role" type="button" role="tab" data-role="${r.key}">${r.label}<span class="role__n">${n}</span></button>`;
}).join('');

function renderNav(){
  const items = reel();
  let html = '', lastGroup = null;
  items.forEach((s, pos)=>{
    if (s.group !== lastGroup){ html += `<span class="nav-group__label">${s.group}</span>`; lastGroup = s.group; }
    html += `<button class="nav-item" type="button" data-i="${s.i}">`
          + `<span class="nav-item__num">${String(pos+1).padStart(2,'0')}</span><span>${s.title}</span></button>`;
  });
  navEl.innerHTML = html;
  navEl.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click', ()=>show(+b.dataset.i)));
  rolesEl.querySelectorAll('.role').forEach(b=>{
    const on = b.dataset.role === role.key;
    b.classList.toggle('is-on', on);
    b.setAttribute('aria-selected', on);
  });
}

stageEl.innerHTML = SCREENS.map((s,i)=>`
<section class="screen" id="scr-${i}">
  <header class="stage__head">
    <p class="eyebrow">${s.group} · Screen ${String(i+1).padStart(2,'0')} of ${SCREENS.length}</p>
    <h1 class="stage__title">${s.title}</h1>
    <p class="stage__desc">${s.desc}</p>
    <span class="route">Route <b class="mono">${s.route}</b></span>
  </header>
  ${s.route.includes('viewport') || s.route.includes('globals')
    ? (s.group==='System' && s.title==='Mobile' ? s.html : `<div class="frame"><div class="frame__body">${s.html}</div></div>`)
    : `<div class="frame">
        <div class="frame__bar">
          <span class="dots"><i></i><i></i><i></i></span>
          <span class="frame__url mono">localhost:3000<b>${s.route}</b></span>
        </div>
        <div class="frame__body">${s.html}</div>
      </div>`}
  <div class="notes">
    <p class="notes__title">Design decisions &amp; API constraints</p>
    <ul>${s.notes.map(n=>`<li class="${n.includes('class="warn"')?'warn':''}">${n}</li>`).join('')}</ul>
  </div>
  <p class="swipe-hint">Swipe left or right to move through the walkthrough</p>
</section>`).join('');

const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pagerLabel = document.getElementById('pagerLabel');
const pagerDots = document.getElementById('pagerDots');
let current = 0;   /* absolute index into SCREENS */

function show(i){
  const items = reel();
  /* if the screen isn't in this walkthrough, widen to All rather than showing nothing */
  if (!items.some(s=>s.i===i)){ role = ROLES[0]; renderNav(); }
  current = i;

  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('is-active'));
  document.getElementById('scr-'+i).classList.add('is-active');
  navEl.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('is-active', +b.dataset.i===i));

  const list = reel();
  const pos = list.findIndex(s=>s.i===i);
  prevBtn.disabled = pos <= 0;
  nextBtn.disabled = pos >= list.length - 1;
  pagerLabel.innerHTML = `${role.key === 'All' ? '' : role.label + ' · '}<b>${pos+1}</b> / ${list.length}`;
  pagerDots.innerHTML = list.map((s,p)=>
    `<button class="pager__dot ${p===pos?'is-on':''}" type="button" data-i="${s.i}" aria-label="${s.title}"></button>`).join('');
  pagerDots.querySelectorAll('.pager__dot').forEach(d=>d.addEventListener('click', ()=>show(+d.dataset.i)));

  window.scrollTo({top:0, behavior:'instant'});
  try { history.replaceState(null,'','#'+(i+1)); } catch (e) { /* sandboxed frame */ }
}

function step(dir){
  const list = reel();
  const pos = list.findIndex(s=>s.i===current);
  const nextPos = pos + dir;
  if (nextPos < 0 || nextPos >= list.length) return;
  show(list[nextPos].i);
}
prevBtn.addEventListener('click', ()=>step(-1));
nextBtn.addEventListener('click', ()=>step(1));

/* role chips — jump to the first screen of that walkthrough */
rolesEl.addEventListener('click', e=>{
  const btn = e.target.closest('.role');
  if (!btn) return;
  role = ROLES.find(r=>r.key === btn.dataset.role);
  renderNav();
  const list = reel();
  show(list.some(s=>s.i===current) ? current : list[0].i);
});

/* keyboard */
document.addEventListener('keydown', e=>{
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
});

/* swipe — but never steal a gesture from a mockup that scrolls sideways itself */
let sx = 0, sy = 0, swiping = false;
const scrollsHorizontally = el => {
  const box = el && el.closest && el.closest('.frame__body');
  return !!box && box.scrollWidth > box.clientWidth + 4;
};
stageEl.addEventListener('touchstart', e=>{
  if (e.touches.length !== 1 || scrollsHorizontally(e.target)) { swiping = false; return; }
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiping = true;
}, {passive:true});
stageEl.addEventListener('touchend', e=>{
  if (!swiping) return;
  swiping = false;
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) step(dx < 0 ? 1 : -1);
}, {passive:true});

renderNav();
const start = Math.min(Math.max(parseInt(location.hash.slice(1)) || 1, 1), SCREENS.length) - 1;
show(start);

/* theme toggle */
const root = document.documentElement;
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const isDark = root.getAttribute('data-theme') === 'dark'
    || (!root.hasAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
});
</script>
